# NeoGames - production stack for Dokploy (Docker Compose app type).
#
# Services
#   postgres  - database (sessions / cache / queue / broadcasting all use it)
#   backend   - Laravel API + nginx + Reverb websockets + queue worker, all
#               in one container via supervisord (see backend/Dockerfile).
#               NOT publicly routed - only the frontend nginx talks to it,
#               over the private `internal` network.
#   frontend  - nginx: serves the built React SPA AND reverse-proxies
#               /api, /sanctum, /broadcasting, /storage, /app (ws) and /up
#               to `backend` (see frontend/nginx.conf). This is the single
#               public origin - the app is same-origin by design (mirrors
#               frontend/vite.config.ts's dev proxy), which is what makes
#               Sanctum cookie auth and the OAuth redirect flow work.
#
# Routing: add ONE domain in Dokploy's "Domains" tab → Service: frontend,
# Port: 80, HTTPS + Let's Encrypt. Do not add a domain for backend, and do
# not add traefik.* labels here.
#
# Reverb: the browser hits wss://<domain>/app/... → frontend nginx →
# backend nginx → loopback Reverb. Laravel publishes events to Reverb over
# the container loopback (REVERB_HOST=127.0.0.1 below). Two separate paths.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neogames}
      POSTGRES_USER: ${POSTGRES_USER:-neogames}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neogames} -d ${POSTGRES_DB:-neogames}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # --- core ---
      APP_NAME: ${APP_NAME:-NeoGames}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?set APP_KEY - run php artisan key:generate --show}"
      APP_URL: https://${APP_DOMAIN:?set APP_DOMAIN}
      PORT: "8000"

      # --- logging: straight to stdout/stderr so `dokploy logs` shows it ---
      LOG_CHANNEL: stderr
      LOG_STACK: stderr
      LOG_LEVEL: ${LOG_LEVEL:-warning}

      # --- database ---
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:-neogames}
      DB_USERNAME: ${POSTGRES_USER:-neogames}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}

      # --- session / auth (single origin: SPA + API on the same host) ---
      SESSION_DRIVER: database
      SESSION_LIFETIME: "120"
      SESSION_ENCRYPT: "true"
      SESSION_SECURE_COOKIE: "true"
      SESSION_SAME_SITE: lax
      # Same-origin, so a cookie Domain is not required. Only set
      # SESSION_DOMAIN (e.g. ".neocodes.ch") if you also serve the app from
      # other subdomains of that root.
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}
      FRONTEND_URL: https://${APP_DOMAIN}
      SANCTUM_STATEFUL_DOMAINS: ${APP_DOMAIN}

      # --- queue / cache / broadcasting / files ---
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      BROADCAST_CONNECTION: reverb
      FILESYSTEM_DISK: local

      # --- Reverb: shared app credentials + the loopback target Laravel
      #     uses to publish events (nginx proxies the public /app/ path) ---
      REVERB_APP_ID: ${REVERB_APP_ID:-neogames}
      REVERB_APP_KEY: ${REVERB_APP_KEY:?set REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:?set REVERB_APP_SECRET}
      REVERB_HOST: "127.0.0.1"
      REVERB_PORT: "8080"
      REVERB_SCHEME: http

      # --- mail (verification codes, password resets) ---
      # Most hosts block outbound SMTP (25/465/587). If MAIL_MAILER=smtp
      # times out, set MAIL_MAILER=resend + RESEND_API_KEY (HTTPS, port 443),
      # or MAIL_MAILER=log to dump the code into the container logs.
      MAIL_MAILER: ${MAIL_MAILER:-log}
      # TLS on by default: port 465 = implicit TLS, else STARTTLS when
      # offered. MAIL_PASSWORD is required for SMTP auth.
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTO_TLS: ${MAIL_AUTO_TLS:-true}
      MAIL_TIMEOUT: ${MAIL_TIMEOUT:-15}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@${APP_DOMAIN}}
      MAIL_FROM_NAME: ${APP_NAME:-NeoGames}

      # --- social login (optional - leave blank to disable a provider) ---
      # Register these exact callback URLs in the Google / Discord consoles.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: https://${APP_DOMAIN}/api/auth/google/callback
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: https://${APP_DOMAIN}/api/auth/discord/callback

      # --- music (Songle song pool: Spotify metadata/popularity, iTunes
      # previews). Playlists are managed in the admin dashboard; seed with
      # the "Sync now" button or `php artisan songs:sync`. ---
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
    volumes:
      # Uploaded avatars etc. `storage/app` only - keeps the image's
      # storage/framework (compiled views, etc.) intact.
      - backend_storage:/var/www/html/storage/app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/up >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    expose:
      - "8000"
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty -> the SPA uses relative URLs (same origin) and derives the
        # Reverb host from window.location. Only the app key is needed.
        VITE_API_URL: ""
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:?set REVERB_APP_KEY}
        VITE_REVERB_HOST: ""
        VITE_REVERB_PORT: ""
        VITE_REVERB_SCHEME: ""
    restart: unless-stopped
    depends_on:
      - backend
    # Add the domain in Dokploy's "Domains" tab: Service = frontend,
    # Port = 80, HTTPS + Let's Encrypt.
    expose:
      - "80"
    networks:
      - internal
      - dokploy-network

volumes:
  pgdata:
  backend_storage:

networks:
  # Pre-created by Dokploy; Traefik lives here.
  dokploy-network:
    external: true
  internal:
