# Static host for the built React SPA. Traefik (Dokploy's ingress) terminates
# TLS and forwards plain HTTP here on port 80.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints every asset filename, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.svg { expires 7d; try_files $uri =404; }

    # SPA fallback - every unknown path renders index.html so react-router
    # can take over client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, or a deploy leaves clients
    # pinned to stale asset hashes.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Security headers for the SPA origin (the API sets its own - see
    # backend/docker/nginx.conf.template). connect-src is deliberately broad
    # (https:/wss:) because the API + Reverb live on a different subdomain;
    # tighten it to your exact api host once that's fixed.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # camera/mic allowed for this origin - the DDF game mode uses getUserMedia
    # (see src/components/ddf/DdfWebcamGrid.tsx, hooks/useAvConsent.ts).
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: wss:; script-src 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
