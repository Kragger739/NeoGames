# Single public origin for the whole app. Traefik (Dokploy) terminates TLS
# and forwards plain HTTP here on :80.
#
# This nginx does two jobs:
#   1. serve the built React SPA (with client-side routing fallback)
#   2. reverse-proxy the backend paths to the `backend` container - the same
#      set the Vite dev server proxies (see frontend/vite.config.ts), so the
#      browser only ever talks to one origin and Sanctum's cookie auth + the
#      OAuth redirect flow work with no cross-site handling.

# Preserve the original scheme when Traefik already set it, else fall back.
# `map` must live in http context - a conf.d/*.conf file is included there.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    # Docker's embedded DNS + a variable upstream so nginx re-resolves the
    # backend container instead of pinning its boot-time IP (survives a
    # backend redeploy without restarting this container).
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend "http://backend:8000";

    # Forwarded to the backend on every proxied request (Laravel trusts all
    # proxies - see backend bootstrap/app.php).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;

    # ── Backend (Laravel) ──────────────────────────────────────────────────
    location = /up          { proxy_pass $backend; }
    location /api/          { proxy_pass $backend; }
    location /sanctum/      { proxy_pass $backend; }
    location /broadcasting/ { proxy_pass $backend; }
    location /storage/      { proxy_pass $backend; }

    # Reverb websocket upgrade path → backend nginx → loopback Reverb.
    # A location with its own proxy_set_header drops the server-level ones,
    # so they're repeated here.
    location /app/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── SPA ────────────────────────────────────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /favicon.svg { expires 7d; try_files $uri =404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Security headers for the SPA origin. API is same-origin now, so
    # connect-src 'self' covers XHR; wss: for the Reverb socket. camera/mic
    # allowed for the DDF game mode (src/hooks/useAvConsent.ts).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' wss:; script-src 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
