    <script>
      // Resolve the effective theme before first paint so there's no flash.
      // Mirrors themeStore's logic; keep the two in sync. System (no stored
      // value) follows the OS; an explicit 'light'/'dark' always wins.
      (function () {
        try {
          var p = localStorage.getItem("neo-theme");
          var t =
            p === "light" || p === "dark"
              ? p
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
