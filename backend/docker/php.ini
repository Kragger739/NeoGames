; Copied into /usr/local/etc/php/conf.d/zz-uploads.ini by the Dockerfile.
; Stock php:8.4-fpm-alpine ships upload_max_filesize=2M / post_max_size=8M,
; which is the real ceiling on uploads regardless of nginx's own
; client_max_body_size. "Dub Together" clip videos need headroom.
upload_max_filesize = 40M
post_max_size = 48M
memory_limit = 256M
